<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta description="A Simple Tic-Tac-Toe Game" />
    <meta name="keywords" content="HTML,CSS,JavaScript,Tic-Tac-Toe-Game,Game" />
    <title>Tic-Tac-toe</title>
    <link
      rel="icon"
      href="icon/tic-tac-toe-game-svgrepo-com-hwhite.svg"
      type="image/svg"
    />
    <link rel="stylesheet" href="css/style.css" type="text/css"/>
    <script src="js/screen.js" defer></script>
    <scirpt src="js/bot/bot.js" defer></scirpt>
    <script src="js/gamelogic/game.js" defer></script>
  </head>
  <body>
    <header>
      <div id="div-header">
        <h1>Tic-Tac-Toe</h1>
        <div id="div-header-selector">
          <h3>Mode:</h3>
          <select id="mode-selector" class="selector-class">
            <option value="PVP">Player Vs Player</option>
            <option value="PVM">Player vs Machine</option>
          </select>
          <h3 id="h3-difficult" class="extraselector">Difficult:</h3>
          <select id="difficult-selector" class="selector-class extraselector">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
      </div>
    </header>
    <div>
      <table id="game-board">
        <tbody>
          <tr>
            <td id="0-0"></td>
            <td id="0-1"></td>
            <td id="0-2"></td>
          </tr>
          <tr>
            <td id="1-0"></td>
            <td id="1-1"></td>
            <td id="1-2"></td>
          </tr>
          <tr>
            <td id="2-0"></td>
            <td id="2-1"></td>
            <td id="2-2"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <footer>
      <div id="footer-div">
        <div class="score-div">
          <label class="score-label" id="score_player1">0</label>
          <label id="description_player1">Player 1</label>
        </div>
        <label>Score</label>
        <div class="score-div">
          <label class="score-label" id="score_player2">0</label>
          <label id="description_player2">Player 2</label>
        </div>
      </div>
    </footer>
  </body>
</html>
